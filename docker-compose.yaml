services:
  space-invaders:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space-invaders
    restart: unless-stopped
    ports:
      - "22226:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - JAVA_OPTS=-Djava.awt.headless=true -XX:+UseContainerSupport -XX:MaxRAMPercentage=75
    volumes:
      # Bestenliste persistent speichern
      - space_invaders_data:/app/data
    networks:
      - default
      - cloudflare
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

volumes:
  space_invaders_data:

networks:
  default:
    driver: bridge
  cloudflare:
    external: true
    name: cloudflare-tunnel-net