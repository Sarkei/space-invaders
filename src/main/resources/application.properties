# Web-Server
server.port=${PORT:8080}

# H2-Datenbank (file-based, persistent)
# Im Docker-Modus DATA_DIR=/app/data setzen, damit die Bestenliste erhalten bleibt
# AUTO_SERVER entfällt – nur eine App-Instanz pro Container (H2 2.x unterstützt AUTO_SERVER+DB_CLOSE_ON_EXIT nicht)
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/spaceinvaders;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Banner deaktivieren
spring.main.banner-mode=off

# Logging
logging.level.root=WARN
logging.level.com.spaceinvaders=INFO
